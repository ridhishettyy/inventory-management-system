<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">

<div class="max-w-md mx-auto mt-10 bg-gray-800 p-6 rounded-xl">

    <h2 class="text-xl font-bold mb-4">Update Order</h2>

    <form method="POST">
        {% csrf_token %}

        <select name="status" class="w-full p-2 text-black">
            <option>Pending</option>
            <option>Shipped</option>
            <option>Delivered</option>
        </select>

        <button class="bg-blue-500 mt-3 px-4 py-2 rounded">
            Update
        </button>
    </form>

</div>

</body>
